<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Torchlight II Item Database</title>
<style>
:root{
  /* --sprite is not here: at 4.8 MB of base64 it is too large to travel through
     a custom property and is written into the rule that draws it. See the note
     at the top of app.css. */
  --esprite:url(data:image/png;base64,__ELEM__);
  --ew:__EW__px;
  --eh:__EH__px;
}
/*__CSS__*/
</style>
</head>
<body>
<div id="app">

  <aside id="rail">
    <div class="brand">
      <div class="brow">
        <span class="bt">Torchlight II</span>
        <a href="#reset" id="reset">Reset</a>
      </div>
      <small>Item Database</small>
      <!-- The repository this page is built from, in the masthead because that
           is where a reader looks for who made the thing. It lives in the rail,
           so below 769px it is reached by opening the drawer -- the same trade
           the socketables link in #bar documents from the other side. The arrow
           marks it as the page's only link that leaves the site. -->
      <a class="bsrc" href="https://github.com/Faust404/Torchlight-2-Database"
         target="_blank" rel="noopener noreferrer">Source on GitHub<span class="up">&#8599;</span></a>
    </div>
    <div class="rsearch">
      <input id="q" type="search" placeholder="Search name or type&hellip;" autocomplete="off">
    </div>
    <div id="railbody"></div>
  </aside>
  <div id="railscrim"></div>

  <!-- The advanced panel. It is a sibling of #rail rather than a child of it:
       below 769px the rail is a drawer under `transform`, and a transformed
       ancestor becomes the containing block for a fixed child -- so a panel
       nested in the rail would be trapped inside the 220px drawer. Both scrim
       and panel are out here, above the rail's own z-index. -->
  <div id="advscrim"></div>
  <div id="adv" role="dialog" aria-modal="true" aria-labelledby="advh">
    <div id="advhead">
      <span class="t" id="advh">Advanced Search</span>
      <button id="advx" title="Close without searching" aria-label="Close">&#10005;</button>
    </div>
    <!-- The stat picker's vocabulary, filled once at startup from window.DB.aff
         so the <input list> typeahead is the corpus's own list and not a second
         copy of it. Native: no library, and it works from file://. -->
    <datalist id="advstats"></datalist>
    <div id="advb"></div>
    <div id="advf">
      <button id="advrst">Reset</button>
      <span class="sp"></span>
      <button id="advgo">Search</button>
    </div>
  </div>

  <main id="main">
    <div id="grid-wrap">
      <div id="bar">
        <button id="railbtn" title="Filters">&#9776;</button>
        <span class="count" id="count"></span>
        <button id="onlyset" aria-pressed="false" title="Show only set items">Only Sets</button>
        <select id="setsel" title="Show one set"><option value="">any set</option></select>
        <!-- The way to the socketables page, and the only outbound link on this
             page. It sits with the set controls, and in the bar at all because
             the bar is the one piece of chrome no breakpoint hides: below 769px
             the rail goes off-canvas behind #railbtn and .brand goes with it, so
             a link up there would be unreachable without opening the drawer
             first. -->
        <a class="bar-nav" href="socketables.html">Socketables Table</a>
        <span class="sp"></span>
        <!-- Last in the bar before Sort, and the only control here that opens
             something rather than narrowing what is already on screen. It wore
             the toolbar's plain chrome while it sat first among the filters;
             down here, beside a label and a select, it has to read as the way
             into the search rather than as one more filter. -->
        <button id="advbtn" aria-expanded="false" aria-controls="adv"
                title="Search by stats, affixes and properties">Advanced Search</button>
        <label for="sort">Sort</label>
        <select id="sort">
          <option value="tier">Tier</option>
          <option value="name">Name</option>
          <option value="level">Level</option>
          <option value="type">Type</option>
          <option value="damage">Damage</option>
          <option value="armor">Armor</option>
        </select>
        <button id="dir" title="Reverse order">&#8595;</button>
      </div>
      <div id="tiers"></div>
      <!-- The results row. #bar and #tiers are outside it and stay full width,
           so opening an item cannot re-wrap the toolbar -- an item opening is
           no reason for the Sort control to move. -->
      <div id="split">
        <div id="scroll"><div id="grid"></div><div id="more"></div></div>
        <!-- The item panel. .dbar is a fixed row and #dscroll holds the card, so
             a set ladder or one of the eyes' four-level tables does not have to
             be scrolled back up before it can be dismissed.

             The control wears two labels because it does two different things:
             a close ✕ here, where the grid is still beside the panel, and the
             route home on a phone, where opening an item really has replaced
             the results. It keeps the `back` class either way -- the delegated
             handler and verify/check_page.js both select it by that name. -->
        <div id="detail">
          <div class="dbar">
            <a class="back" href="#" aria-label="Close"><span
              class="dw">&#10005;</span><span class="dn">&larr; back to results</span></a>
          </div>
          <div id="dscroll"></div>
        </div>
      </div>
    </div>
  </main>

</div>
<script>window.DB=/*__DATA__*/;</script>
<script>window.TAXONOMY=/*__TAXONOMY__*/;</script>
<script>/*__JS__*/</script>
</body>
</html>
